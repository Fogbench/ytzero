name: Release tarball

# Runs when a tag starting with "v" is pushed (or by hand). It builds the tarball
# and its checksum and attaches them to a DRAFT release, and builds and smoke-tests
# the Docker image. Nothing is public until the draft is published by hand on GitHub:
# publishing it runs this workflow again, and only that run pushes the image
# ghcr.io/fogbench/ytzero:<version> and :latest (x86_64 and aarch64).
# Each CPU type is built and smoke-tested natively on its own runner in every run
# (so an aarch64 problem shows while the release is still a draft) and pushed on
# its own: an aarch64 failure never holds back the x86_64 image, or the reverse.
# Third-party actions are pinned by commit; the tag is in the comment.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for the files (CalVer, for example 2026.10.2)"
        required: true
  release:
    types: [published]

jobs:
  tarball:
    name: Build the tarball and draft the release
    # Publishing the draft does not rebuild the tarball; that run is for the image only.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    # Only this job may write to the repository (it creates the release).
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do not leave the token in .git/config while installs and the build run.
          persist-credentials: false

      - name: Check that an existing tag matches this build
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # An existing tag is kept by "gh release create", so its source archive would
          # be the tag's commit. If that is not the commit built here, the tarball and
          # the source would not match. Stop before building. No tag yet: nothing to check.
          # The checkout has fetch-depth 0, so all tags are present locally.
          if tag_commit=$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}"); then
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $VERSION points at $tag_commit but this run built $GITHUB_SHA: delete the tag or dispatch from that commit."
              exit 1
            fi
          fi

      - name: Set up the Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same Bun version as scripts/release/tools.lock. Change both together.
          bun-version: 1.4.2

      - name: Install server dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build the tarball
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: bash scripts/package-release.sh "$VERSION"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # --target makes a tag that does not exist yet (manual run) point at the
          # commit that was built, not at the default branch. An existing tag is kept.
          notes="Draft: edit the notes, then publish.

          Docker (x86_64 and aarch64; pushed when this release is published): \`docker pull ghcr.io/fogbench/ytzero:$VERSION\`, or run it with the compose file: https://github.com/Fogbench/ytzero/blob/$VERSION/compose.yaml"
          gh release create "$VERSION" --draft --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "$notes" \
            release/ytzero-"$VERSION".tar.gz release/ytzero-"$VERSION".tar.gz.sha256

  plan:
    name: Decide the version and whether to publish the image
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Decide
        id: plan
        env:
          VERSION: ${{ github.event.release.tag_name || github.event.inputs.version || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Only a published app release (CalVer, not a pre-release such as tools-ffmpeg-7.0.2)
          # pushes the image. Every other run builds and smoke-tests it only.
          publish=false; skip=false
          if [ "$EVENT" = release ]; then
            if [[ "$VERSION" =~ ^[1-9][0-9]{3}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]] && [ "$PRERELEASE" != true ]; then
              publish=true
            else
              echo "$VERSION is not an app release (CalVer, not a pre-release): no image."
              skip=true
            fi
          fi
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "::error::bad version '$VERSION'"; exit 1; }
          { echo "version=$VERSION"; echo "publish=$publish"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

  image:
    name: Build, test and push the Docker image (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # one CPU type failing must not cancel the other
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # native: no QEMU, so the smoke test runs the real thing
    permissions:
      contents: read
      packages: write   # used only by the push step, which runs only when a release is published
    env:
      IMAGE: ghcr.io/fogbench/ytzero
      VERSION: ${{ needs.plan.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ytzero:smoke
          build-args: |
            YTZERO_VERSION=${{ needs.plan.outputs.version }}
            YTZERO_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Smoke test (start, health, tools, first yt-dlp update, one direct play)
        run: bash scripts/docker/smoke-test.sh ytzero:smoke "$VERSION" 3113

      - name: Log in to the GitHub container registry
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image as <version>-<arch>
        if: needs.plan.outputs.publish == 'true'
        # The exact image the smoke test ran, not a rebuild.
        run: |
          docker tag ytzero:smoke "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH"

  manifest:
    name: Publish <version> and latest for the CPU types that passed
    needs: [plan, image]
    # Runs even when one CPU type failed, so the other one is still published.
    if: always() && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/fogbench/ytzero
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Log in to the GitHub container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine the pushed CPU types under <version> and latest
        run: |
          refs=(); missing=()
          for arch in amd64 arm64; do
            if docker buildx imagetools inspect "$IMAGE:$VERSION-$arch" >/dev/null 2>&1; then
              refs+=("$IMAGE:$VERSION-$arch")
            else
              missing+=("$arch")
            fi
          done
          [ "${#refs[@]}" -gt 0 ] || { echo "::error::no CPU type was pushed for $VERSION"; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "${refs[@]}"
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::$VERSION was published without: ${missing[*]} (see the image job of that CPU type)."
          fi
