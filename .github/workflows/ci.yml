name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate the application and web client
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install server dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Install web client dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Prevent large files from growing
        run: bun run check:large-files

      - name: Require SQLite and PostgreSQL migrations
        run: bun run check:database-migrations

      - name: Check server types
        working-directory: app
        run: bun run typecheck

      - name: Check web client types
        working-directory: ui
        run: bun run typecheck

      - name: Test the server
        working-directory: app
        run: bun run test

      - name: Test the server in randomized order
        working-directory: app
        run: bun run test:random

      - name: Test the web client
        working-directory: ui
        run: bun run test

      - name: Build the web client
        working-directory: ui
        run: bun run build:prepared
