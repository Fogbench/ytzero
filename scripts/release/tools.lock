# tools.lock: the exact third-party tools this release installs.
# One line per download: <tool> <version> <arch> <url> <sha256>
# arch is x86_64, x86_64-baseline (Bun for CPUs without AVX2) or aarch64.
# Several lines with the same tool, version and arch are mirrors of the same
# file (tried in order); the sha256 is always checked. Nothing here is "latest".
# Checksums were checked against the publishers' own lists (Bun SHASUMS256.txt,
# yt-dlp SHA2-256SUMS, Deno .sha256sum, ffmpeg .md5).
# The LAST ffmpeg mirror of each CPU is our own copy of the identical file, an
# asset of the GitHub release tagged tools-ffmpeg-7.0.2 (a fixed tag that never
# moves), uploaded by hand once per ffmpeg version. It has the same sha256 as
# the johnvansickle.com lines and is only used when those hosts fail. When the
# ffmpeg version changes, upload the new files under a new tag tools-ffmpeg-<version>.
